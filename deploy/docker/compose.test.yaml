name: mirrors-waf-test

services:
  mirrors-waf:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VERSION: docker-test
        COMMIT: local
        BUILD_TIME: docker
    image: mirrors-waf-backend:test
    command: ["--config", "/etc/mirrors-waf/config.yaml"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: ./config.test.yaml
        target: /etc/mirrors-waf/config.yaml
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
