# =============================================================================
# Nginx configuration for the mirrors-waf PoW backend.
#
# This file is an example; adjust server_name, root, listen, and the
# auth_request upstream to match your deployment.
#
# See BACKEND_DESIGN.md §12 for the full reference.
# =============================================================================

# Real-IP configuration: if there's a CDN or load balancer in front of
# Nginx, list its IP ranges here so X-Forwarded-For is trusted.
# set_real_ip_from 10.0.0.0/8;
# set_real_ip_from 192.168.0.0/16;
# real_ip_header X-Forwarded-For;
# real_ip_recursive on;

server {
    listen 80;
    # listen 443 ssl http2;
    # ssl_certificate     /etc/ssl/mirrors.example.edu/fullchain.pem;
    # ssl_certificate_key /etc/ssl/mirrors.example.edu/privkey.pem;

    server_name mirrors.example.edu;

    root /srv/mirrors;
    autoindex on;

    # ---- Small-file / HTML / metadata: no PoW required ----
    location / {
        try_files $uri $uri/ =404;
    }

    # ---- Large files: PoW required via auth_request ----
    location ~* \.(iso|img|qcow2|vmdk|vdi|ova|zip|7z|tar|tar\.gz|tar\.xz)$ {
        auth_request /_pow_auth;

        # Capture the response headers emitted by the backend so we can
        # surface them in error pages and pass rate limits downstream.
        auth_request_set $pow_result       $upstream_http_x_pow_result;
        auth_request_set $pow_reason       $upstream_http_x_pow_reason;
        auth_request_set $pow_decision      $upstream_http_x_pow_decision;
        auth_request_set $pow_mode         $upstream_http_x_pow_mode;
        auth_request_set $pow_error        $upstream_http_x_pow_error;
        auth_request_set $pow_uses         $upstream_http_x_pow_uses;
        auth_request_set $pow_max_uses     $upstream_http_x_pow_max_uses;
        auth_request_set $pow_limit_rate   $upstream_http_x_pow_limit_rate;
        auth_request_set $pow_chain        $upstream_http_x_pow_chain;
        auth_request_set $pow_rule         $upstream_http_x_pow_rule;
        auth_request_set $pow_dry_run_err  $upstream_http_x_pow_dry_run_original_error;

        # Apply the rate limit returned by the backend. "0" means no
        # limit. Empty means "use the default" — configure a sane default
        # below.
        limit_rate ${pow_limit_rate:-0};

        # Optional: log the decision category (verified / unverified_slow /
        # unverified_very_slow / not_protected / denied) for access-log
        # analysis. See BACKEND_DESIGN.md §26.4.
        # log_format pow '$remote_addr $request "$pow_decision" "$pow_reason" $status $body_bytes_sent';

        # Map backend status codes to user-friendly error pages.
        error_page 403 = @pow_forbidden;
        error_page 429 = @pow_rate_limited;
        error_page 500 502 503 504 = @pow_backend_error;

        try_files $uri =404;
    }

    # ---- Internal auth_request location: never exposed to clients ----
    location = /_pow_auth {
        internal;

        proxy_pass http://127.0.0.1:8080/verify_pow;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        # The headers Nginx MUST forward to the backend (see §12.2).
        proxy_set_header X-Original-URI    $uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-Args   $args;
        proxy_set_header X-Original-Range  $http_range;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header User-Agent        $http_user_agent;

        # Tight timeouts: auth_request is on the critical path.
        proxy_connect_timeout 1s;
        proxy_send_timeout    2s;
        proxy_read_timeout    2s;
    }

    # ---- Error pages ----
    location @pow_forbidden {
        default_type text/html;
        return 403 '<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>下载需要 PoW 验证</title></head>
<body>
<h1>下载需要 PoW 验证</h1>
<p>请在镜像站网页中生成带 token 和 sign 的下载链接。</p>
<p>错误原因：<code>$pow_error</code></p>
</body></html>';
    }

    location @pow_rate_limited {
        default_type text/html;
        return 429 '<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>请求过于频繁</title></head>
<body>
<h1>请求过于频繁</h1>
<p>请稍后重试。</p>
</body></html>';
    }

    location @pow_backend_error {
        default_type text/html;
        return 503 '<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>验证服务暂时不可用</title></head>
<body>
<h1>验证服务暂时不可用</h1>
<p>请稍后重试。</p>
</body></html>';
    }
}

