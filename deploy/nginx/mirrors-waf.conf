# Nginx configuration for the mirrors-waf PoW backend.
#
# This file is an example; adjust server_name, root, listen, and the
# auth_request upstream to match your deployment.

# Undecoded request path/args for the backend: token path validation runs
# on the raw form, so %2F-style encodings survive unchanged.
map $request_uri $original_path {
    ~^(?<mapped_path>[^?]*)(\?.*)?$  $mapped_path;
    default                           $request_uri;
}
map $request_uri $original_args {
    ~^[^?]*\?(?<mapped_args>.*)$  $mapped_args;
    default                       "";
}

server {
    listen 80;
    # listen 443 ssl http2;
    # ssl_certificate     /etc/ssl/mirrors.example.edu/fullchain.pem;
    # ssl_certificate_key /etc/ssl/mirrors.example.edu/privkey.pem;

    server_name mirrors.example.edu;

    root /srv/mirrors;
    autoindex on;

    # ---- Small-file / HTML / metadata: no PoW required ----
    location / {
        try_files $uri $uri/ =404;
    }

    # ---- Large files: PoW required via auth_request ----
    location ~* \.(iso|img|qcow2|vmdk|vdi|ova|zip|7z|tar|tar\.gz|tar\.xz)$ {
        auth_request /_pow_auth;

        auth_request_set $pow_result      $upstream_http_x_pow_result;
        auth_request_set $pow_decision    $upstream_http_x_pow_decision;
        auth_request_set $pow_error       $upstream_http_x_pow_error;
        # Plain byte count from the backend ("0" when unlimited); nginx
        # limit_rate needs a numeric value.
        auth_request_set $pow_limit_bytes $upstream_http_x_pow_limit_rate_bytes;
        limit_rate $pow_limit_bytes;

        try_files $uri =404;
    }

    # ---- Internal auth_request location: never exposed to clients ----
    location = /_pow_auth {
        internal;

        proxy_pass http://127.0.0.1:8080/verify_pow;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        proxy_set_header X-Original-URI    $original_path;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-Args   $original_args;
        proxy_set_header X-Original-Range  $http_range;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header User-Agent        $http_user_agent;

        proxy_connect_timeout 2s;
        proxy_send_timeout    2s;
        proxy_read_timeout    2s;
    }
}
