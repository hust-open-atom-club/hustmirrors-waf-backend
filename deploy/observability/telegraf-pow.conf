# Telegraf snippet: ship Garmr's Prometheus metrics to InfluxDB 3.
#
# Requires Telegraf >= 1.38 for the native influxdb_v3 output (/api/v3/write_lp).
# Include this file from the main telegraf.conf, or drop it into telegraf.d/.
#
# Garmr exposes everything on http://127.0.0.1:8080/metrics and needs no
# extra configuration; the auth_request deployment already runs on the same
# host as Nginx.

[[inputs.prometheus]]
  urls = ["http://127.0.0.1:8080/metrics"]
  metric_version = 2
  # Only the application's own metrics. Host and runtime series (go_*,
  # process_*) belong to telegraf's own inputs; drop this namepass to ship
  # them as well.
  namepass = ["mirrors_waf_*"]

[[outputs.influxdb_v3]]
  ## InfluxDB 3 HTTP endpoint.
  urls = ["http://127.0.0.1:8181"]

  ## Destination database.
  database = "mirrors"

  ## Authorization token; export INFLUX_TOKEN in the telegraf environment.
  token = "${INFLUX_TOKEN}"
