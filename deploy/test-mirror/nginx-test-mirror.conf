# Nginx >= 1.27.3 开源版支持 resolve：动态 DNS 跟随上游 IP 变化。
# 本机 IPv6 不可达，resolver 限定只返回 IPv4 结果，无需 /etc/hosts。
resolver 127.0.0.53 valid=300s ipv6=off;

upstream hust_mirror {
    zone hust_mirror_zone 64k;
    server mirrors.hust.edu.cn:443 resolve;
    keepalive 4;
    keepalive_requests 20;
}

map $pow_limit_bytes $final_limit {
    ~^[0-9]+$  $pow_limit_bytes;
    default    0;
}

map $request_uri $original_path {
    ~^(?<mapped_path>[^?]*)(\?.*)?$  $mapped_path;
    default                            $request_uri;
}
map $request_uri $original_args {

    ~^[^?]*\?(?<mapped_args>.*)$  $mapped_args;
    default                        "";
}

server {
    listen 80 default_server;
    server_name _;

    # 上游 IPv6 在本测试机不可达，强制走 IPv4
    absolute_redirect off;

    root /srv/hust-mirrors/build;

    # ---- 本地前端页面 ----
    location = / {
        try_files /index.html =404;
    }
    location = /release {
        try_files /release/index.html =404;
    }
    location ^~ /assets/ { try_files $uri @upstream_fallback; }
    location ^~ /img/ { try_files $uri @upstream_fallback; }
    location ^~ /pow/ {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location ^~ /en/ { try_files $uri $uri/ =404; }
    location ^~ /docs/ { try_files $uri $uri/ =404; }
    location ^~ /blog/ { try_files $uri $uri/ =404; }
    location ^~ /syncing-status/ { try_files $uri $uri/ =404; }
    location ^~ /fancyindex/ { try_files $uri @upstream_fallback; }

    # ---- JSON 反代 ----
    location = /status.json {
        proxy_pass https://hust_mirror/status.json;
        proxy_ssl_server_name on;
        proxy_ssl_name mirrors.hust.edu.cn;
        proxy_set_header Host mirrors.hust.edu.cn;
        proxy_set_header Accept-Encoding "";
        add_header X-Upstream mirrors.hust.edu.cn always;
    }
    location = /releases.json {
        proxy_pass https://hust_mirror/releases.json;
        proxy_ssl_server_name on;
        proxy_ssl_name mirrors.hust.edu.cn;
        proxy_set_header Host mirrors.hust.edu.cn;
        proxy_set_header Accept-Encoding "";
        add_header X-Upstream mirrors.hust.edu.cn always;
    }

    # ---- 受保护大文件：PoW 验证后反代上游 ----
    location ~* \.(iso|img|qcow2|vmdk|vdi|ova|zip|7z|tar|tar\.gz|tar\.xz)$ {
        auth_request /_pow_auth;

        auth_request_set $pow_result     $upstream_http_x_pow_result;
        auth_request_set $pow_decision   $upstream_http_x_pow_decision;
        auth_request_set $pow_error      $upstream_http_x_pow_error;
        # 后端输出纯字节数（X-Pow-Limit-Rate-Bytes），直接可用于 limit_rate
        auth_request_set $pow_limit_bytes $upstream_http_x_pow_limit_rate_bytes;

                # auth_request_set 变量需经 map 中转才能作为 limit_rate 生效
        limit_rate $final_limit;
        add_header X-Debug-Limit "$pow_limit_bytes" always;

        proxy_pass https://hust_mirror;
        proxy_ssl_server_name on;
        proxy_ssl_name mirrors.hust.edu.cn;
        proxy_set_header Host mirrors.hust.edu.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header Range $http_range;

        proxy_redirect https://mirrors.hust.edu.cn/ /;
        proxy_redirect http://mirrors.hust.edu.cn/ /;

        # limit_rate 对 proxied 响应需要 buffering 开启才能控速
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        send_timeout 1h;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;

    }

    # ---- 内部 auth_request ----
    location = /_pow_auth {
        internal;
        proxy_pass http://127.0.0.1:8080/verify_pow;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI    $original_path;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-Args   $original_args;
        proxy_set_header X-Original-Range  $http_range;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header User-Agent        $http_user_agent;
        proxy_connect_timeout 2s;
        proxy_send_timeout 2s;
        proxy_read_timeout 2s;
    }

    # ---- 其余路径全部反代上游镜像站 ----
    location / {
        proxy_pass https://hust_mirror;
        proxy_ssl_server_name on;
        proxy_ssl_name mirrors.hust.edu.cn;
        proxy_set_header Host mirrors.hust.edu.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header User-Agent $http_user_agent;

        proxy_set_header Accept-Encoding "";

        proxy_redirect https://mirrors.hust.edu.cn/ /;
        proxy_redirect http://mirrors.hust.edu.cn/ /;

        proxy_read_timeout 300s;

        sub_filter_once off;
        
        sub_filter "https://mirrors.hust.edu.cn/" "/";
        sub_filter "http://mirrors.hust.edu.cn/" "/";
        sub_filter "</body>" "<script defer src=\"/pow/proxy-index.js\"></script></body>";
    }
    location @upstream_fallback {
        proxy_pass https://hust_mirror;
        proxy_ssl_server_name on;
        proxy_ssl_name mirrors.hust.edu.cn;
        proxy_set_header Host mirrors.hust.edu.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header Accept-Encoding "";
        proxy_redirect https://mirrors.hust.edu.cn/ /;
        proxy_redirect http://mirrors.hust.edu.cn/ /;
        proxy_read_timeout 60s;
    }

}
